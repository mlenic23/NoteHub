{% extends 'notes/base.html' %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <h2>{{ note.title }}</h2>
    <p>{{ note.content }}</p>
    <p>Published: {{ note.pub_date }}</p>

    <form class = 'like' action="{% url 'notes:like' note.id %}" method="post">
        {% csrf_token %}
        <button type="submit">Like</button>
    </form>
    
    <a href="{% url 'notes:index' %}">Back to Notes</a>
{% endblock %}
