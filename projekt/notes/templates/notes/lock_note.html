{% extends 'notes/base.html' %}

{% block content %}
    <div class="container">
        <h2>Locked Note</h2>
        <p class="lock-note">Enter a password to lock this note. Once locked, you will need the password to access it.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="lock_button">Lock Note</button>
        </form>
    </div>
{% endblock %}
