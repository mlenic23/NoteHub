{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Notes{% endblock %}</title>

    <link rel="stylesheet" type="text/css" href="{% static 'app/notes.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'notes:index' %}">Notes</a>
        <a href="{% url 'notes:add_note' %}">Add Note</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
