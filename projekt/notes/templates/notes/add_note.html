{% extends 'notes/base.html' %}

{% block title %}Add a New Note{% endblock %}

{% block content %}
    <h2>Add a New Note</h2>
    <form method="post">
        {% csrf_token %}
        
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="4" cols="50" required></textarea><br><br>

        <label for="is_public">Make it public:</label>
        <input type="checkbox" id="is_public" name="is_public"><br><br>

        {% if user.is_authenticated and user.type == 'REGULARUSER' %}
            <label for="is_private">Make it private:</label>
            <input type="checkbox" id="is_private" name="is_private"><br><br>

            <label for="category">Category:</label>
            <select name="category" id="category">
                <option value="business">Business</option>
                <option value="personal">Personal</option>
            </select>

        {% endif %}

        {% if user.is_authenticated and user.type == 'SUPERUSER' %}
            <label for="is_important">Mark as Important</label>
            <input type="checkbox" id="is_important" name="is_important">

            <label for="role">Role:</label>
            <select name="role" id="role" class="role-select">
                {% for choice, display_name in role_choices %}
                    <option value="{{ choice }}" {% if choice == 'personal' %}selected{% endif %}>{{ display_name }}</option>
                {% endfor %}
            </select>
        {% endif %}
        <br><br>
        <button type="submit">Save Note</button>
    </form>
    
{% endblock %}
