{% extends 'notes/base.html' %}

{% block content %}
    <div class="container">
        <h2>Locked Notes</h2>
        {% for note in locked_notes %}
            <div class="card my-4 shadow-sm p-3 mb-5">
                <div class="card-body m-2">
                    <h4>{{ note.title }}</h4>
                    <a href="{% url 'notes:view_locked_note' note.id %}" class="btn btn-primary">View Locked Note</a>
                </div>
            </div>
        {% empty %}
            <p>No locked notes available.</p>
        {% endfor %}
    </div>
{% endblock %}
